;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; PHP Configuration
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

memory_limit = 512M

max_execution_time = 300
max_input_time = 300

post_max_size = 100M
upload_max_filesize = 100M

date.timezone = UTC

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; Error Reporting
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

display_errors = On
display_startup_errors = On
error_reporting = E_ALL
log_errors = On

;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
; OPcache
;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;

opcache.enable=1
opcache.enable_cli=1
opcache.validate_timestamps=1
opcache.revalidate_freq=0