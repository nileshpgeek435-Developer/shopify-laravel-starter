services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: shopify-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/php.ini
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - shopify-network

  # Processes queued webhook jobs (APP_UNINSTALLED, WebhookInstaller, etc.)
  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: shopify-queue
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work database --sleep=1 --tries=3 --timeout=90
    volumes:
      - ./src:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/php.ini
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      app:
        condition: service_started
    networks:
      - shopify-network

  nginx:
    image: nginx:1.28-alpine
    container_name: shopify-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - shopify-network

  mysql:
    image: mysql:8.4
    container_name: shopify-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shopify-network

  redis:
    image: redis:7-alpine
    container_name: shopify-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - shopify-network

  node:
    image: node:22-alpine
    container_name: shopify-node
    working_dir: /var/www/html
    tty: true
    stdin_open: true
    volumes:
      - ./src:/var/www/html
    ports:
      - "5173:5173"
    command: sh -c "tail -f /dev/null"
    networks:
      - shopify-network

volumes:
  mysql-data:
  redis-data:

networks:
  shopify-network:
    driver: bridge